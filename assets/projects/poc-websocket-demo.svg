<svg viewBox="0 0 480 150" width="480" height="150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="poc-websocket-demo — Real LLM streaming over raw WebSocket with stop and interrupt-and-replace, like production chat harnesses.">
  <style>
    .mono { font-family: ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s} .a4{animation-delay:.55s} .a5{animation-delay:.7s} .a6{animation-delay:.85s} .a7{animation-delay:1s} .a8{animation-delay:1.15s}
    @media (prefers-reduced-motion: reduce) { .rise,.draw,.blink { animation: none; opacity: 1; stroke-dashoffset: 0; } }
  </style>
  <rect class="rise a1" x="1" y="1" width="478" height="148" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text class="mono rise a2" x="24" y="38" font-size="16" fill="#1F2328" font-weight="700">poc-websocket-demo</text>
  <rect class="rise a2" x="422" y="22" width="32" height="22" rx="11" stroke="#0969DA"/>
  <text class="mono rise a2" x="438.0" y="37" font-size="11" fill="#0969DA" text-anchor="middle" letter-spacing="1.5">AI</text>
  <text class="mono rise a3" x="24" y="72" font-size="12" fill="#1F2328" >Real LLM streaming over raw WebSocket with stop and</text>
  <text class="mono rise a3" x="24" y="92" font-size="12" fill="#1F2328" >interrupt-and-replace, like production chat harnesses.</text>
  <text class="mono rise a4" x="24" y="126" font-size="10" fill="#6E7781" letter-spacing=".8">SPRING AI · WEBSOCKET · REACT 18 · VITE</text>
</svg>
