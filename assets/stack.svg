<svg viewBox="0 0 1000 294" width="1000" height="294" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical stack">
  <style>
    .mono { font-family: ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s} .a4{animation-delay:.55s} .a5{animation-delay:.7s} .a6{animation-delay:.85s} .a7{animation-delay:1s} .a8{animation-delay:1.15s}
    @media (prefers-reduced-motion: reduce) { .rise,.draw,.blink { animation: none; opacity: 1; stroke-dashoffset: 0; } }
  </style>
  <line x1="160" y1="8" x2="160" y2="282" stroke="#D0D7DE" stroke-width="1"/>
  <text class="mono rise a1" x="48" y="32" font-size="11" fill="#6E7781" letter-spacing="2.5">LANGUAGES</text>
  <text class="mono rise a1" x="178" y="32" font-size="15" fill="#1F2328" >Java · TypeScript · Python · SQL · Dart</text>
  <text class="mono rise a2" x="48" y="66" font-size="11" fill="#6E7781" letter-spacing="2.5">BACKEND</text>
  <text class="mono rise a2" x="178" y="66" font-size="15" fill="#1F2328" >Spring Boot · Spring AI · JPA/Hibernate · WebSocket · REST</text>
  <text class="mono rise a3" x="48" y="100" font-size="11" fill="#6E7781" letter-spacing="2.5">AI</text>
  <text class="mono rise a3" x="178" y="100" font-size="15" fill="#0969DA" >Ollama · LLM agents · opencode · tool calling · streaming</text>
  <text class="mono rise a4" x="48" y="134" font-size="11" fill="#6E7781" letter-spacing="2.5">FRONTEND</text>
  <text class="mono rise a4" x="178" y="134" font-size="15" fill="#1F2328" >React · Vite · Angular · Flutter</text>
  <text class="mono rise a5" x="48" y="168" font-size="11" fill="#6E7781" letter-spacing="2.5">ARCH</text>
  <text class="mono rise a5" x="178" y="168" font-size="15" fill="#1F2328" >Clean Architecture · Ports &amp; Adapters · DDD · Microservices</text>
  <text class="mono rise a6" x="48" y="202" font-size="11" fill="#6E7781" letter-spacing="2.5">DATA</text>
  <text class="mono rise a6" x="178" y="202" font-size="15" fill="#1F2328" >PostgreSQL · Supabase · Pandas · Jupyter</text>
  <text class="mono rise a7" x="48" y="236" font-size="11" fill="#6E7781" letter-spacing="2.5">CLOUD</text>
  <text class="mono rise a7" x="178" y="236" font-size="15" fill="#1F2328" >Docker · Kubernetes · AWS (EKS, API Gateway, Lambda, RDS)</text>
  <text class="mono rise a8" x="48" y="270" font-size="11" fill="#6E7781" letter-spacing="2.5">DEVOPS</text>
  <text class="mono rise a8" x="178" y="270" font-size="15" fill="#1F2328" >Terraform · GitHub Actions · Maven · Git</text>
</svg>
