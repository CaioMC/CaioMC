<svg viewBox="0 0 1000 350" width="1000" height="350" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Caio Miranda Coelho — Software Engineer at TOTVS">
  <style>
    .mono { font-family: ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s} .a4{animation-delay:.55s} .a5{animation-delay:.7s} .a6{animation-delay:.85s} .a7{animation-delay:1s} .a8{animation-delay:1.15s}
    @media (prefers-reduced-motion: reduce) { .rise,.draw,.blink { animation: none; opacity: 1; stroke-dashoffset: 0; } }
  </style>
  <line class="draw" x1="48" y1="58" x2="952" y2="58" stroke="#D0D7DE" stroke-width="1"/>
  <text class="mono rise a1" x="48" y="44" font-size="11" fill="#6E7781" letter-spacing="3.5">PROFILE — INDEX Nº 001</text>
  <text class="mono rise a1" x="952" y="44" font-size="11" fill="#6E7781" letter-spacing="3.5" text-anchor="end">JOINVILLE, SC — 26.30° S</text>
  <text class="mono rise a2" x="46" y="160" font-size="64" fill="#1F2328" letter-spacing="-2">Caio Miranda Coelho</text>
  <text class="mono rise a3" x="48" y="202" font-size="19" fill="#6E7781" >Software Engineer @ TOTVS — AI &amp; Software Architecture.</text>
  <text class="mono rise a4" x="48" y="262" font-size="16" fill="#0969DA">$ whoami --focus<tspan fill="#1F2328"> ai-agents · clean-architecture · ddd · cloud</tspan><tspan class="blink" fill="#0969DA"> ▌</tspan></text>
  <line class="draw a5" x1="48" y1="300" x2="952" y2="300" stroke="#D0D7DE" stroke-width="1"/>
  <text class="mono rise a6" x="48" y="326" font-size="13" fill="#6E7781" font-style="italic">“Focusing on the process and trusting in the hard work when it matters most.”</text>
</svg>
